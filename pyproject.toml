[project]
name = "nostrhost-auth"
version = "0.1.0"
description = "nostrhost reusable authentication/identity library: Nostr identity, challenges, NIP-01/42 signature verification, npub conversion, pubkey mappings, relay resolution, NIP-05"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "nostr-sdk>=0.45.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nostrhost_auth"]